services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory -disableTelemetry
    ports:
      - "8000:8000"

  seed:
    build:
      context: .
      target: app
    entrypoint: ["python", "docker/seed.py"]
    depends_on:
      - dynamodb
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-west-2
      CONGRESSIONAL_TABLE_NAME: current-officials
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
    restart: "no"

  api:
    build:
      context: .
      target: app
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-west-2
      CONGRESSIONAL_TABLE_NAME: current-officials
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
    ports:
      - "9000:8080"

  refresh:
    build:
      context: .
      target: app
    command: ["src.refresh.lambda_handler"]
    depends_on:
      seed:
        condition: service_completed_successfully
    env_file: .env
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-west-2
      CONGRESSIONAL_TABLE_NAME: current-officials
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
    ports:
      - "9001:8080"
    profiles: ["refresh"]
